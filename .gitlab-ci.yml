stages:
  - build
  - docs

before_script:
  # libssl-dev for cargo-deadlinks
  - apt-get update -qq && apt-get install -y -qq git curl libclang-common-19-dev clang libsdl2-dev libsdl2-gfx-dev libsdl2-doc libsdl2-ttf-dev libssl-dev
  - curl https://sh.rustup.rs -sSf | sh -s -- -y
  - source /opt/yottadb/current/ydb_env_set
  - source $HOME/.cargo/env

rust-compat:
  stage: build
  image: yottadb/yottadb-base:latest-master
  script:
    - rustup toolchain install 1.71.0
    - rustup default 1.71.0
    - cargo build --verbose

rust-latest:
  stage: build
  image: yottadb/yottadb-base:latest-master
  script:
    - cargo fmt -- --check
    - cargo clippy -- --deny clippy::all --allow clippy::uninlined-format-args
    - cargo build --verbose
    - cargo test --verbose
    - cargo run --example xyzInitRust
    # NOTE: exits with success if and only if `xyzTransRust` times out
    # This prevents false negatives due to the compile failing and false positives due to the timeout.
    - timeout 5s cargo run --example xyzTransRust && false || [ $? = 124 ]
    - cargo run --example xyzVerifyRust

commit-verify:
  image: ubuntu:24.04
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq git wget gnupg
  script:
    # Copy commit gpg key verify script to build directory and execute
    - wget https://gitlab.com/YottaDB/DB/YDB/-/raw/master/ci/commit_verify.sh
    - chmod +x commit_verify.sh
    - ./commit_verify.sh tests/needs_copyright.sh https://gitlab.com/YottaDB/Lang/YDBRust

rust-no-vendor:
  stage: build
  image: yottadb/yottadb-base:latest-master
  # Cache paths have to be inside the project directory, and the cache needs a key of its own so that
  # other jobs using the default key do not overwrite it. The key carries the bindgen-cli version, so
  # bumping that version starts from an empty cache rather than reusing the old binary.
  cache:
    key: bindgen-cli-0.62.0
    paths:
      - .cargo-tools
  script:
    # "cargo install --root" keeps the binary inside the project directory, where the cache can hold
    # it; install only when a previous run has not already left it there.
    - |
      if [ ! -x .cargo-tools/bin/bindgen ]; then
        cargo install --debug --version 0.62.0 --root .cargo-tools bindgen-cli
      fi
    - export PATH="$PWD/.cargo-tools/bin:$PATH"
    - cargo check --no-default-features

rust-nightly:
  stage: build
  image: yottadb/yottadb-base:latest-master
  script:
    - rustup toolchain install nightly
    - rustup default nightly
    - cargo build --verbose
    - cargo test --verbose
  allow_failure: true

docker:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  before_script:
    - ''
  script:
    - docker build . -t ydbrust
    - docker run -v $(realpath .):/opt/ydbrust ydbrust bash -i -c 'source $(pkg-config --variable=prefix yottadb)/ydb_env_set && cargo run --example say_hello_rust'

pages:
  image: yottadb/yottadb-base:latest-master
  stage: docs
  dependencies:
    - rust-compat
  # Cache paths have to be inside the project directory, and the cache needs a key of its own so that
  # other jobs using the default key do not overwrite it.
  cache:
    key: cargo-deadlinks
    paths:
      - cargo-deadlinks
      - cargo-deadlinks.version
  script:
    - apt-get update -qq && apt-get install -y -qq jq wget
    # wget treats a 5xx as fatal and does not retry it by default, so ask for retries explicitly.
    - WGET_RETRY="--tries=3 --waitretry=5 --retry-on-http-error=500,502,503,504"
    - export DEADLINKS_VERSION=$(wget -q $WGET_RETRY -O - https://api.github.com/repos/deadlinks/cargo-deadlinks/releases/latest | jq --raw-output .tag_name)
    # Download only when the cached binary is absent or is not the version just resolved.
    - |
      if [ ! -s cargo-deadlinks ] || [ "$(cat cargo-deadlinks.version 2>/dev/null)" != "$DEADLINKS_VERSION" ]; then
        wget $WGET_RETRY "https://github.com/deadlinks/cargo-deadlinks/releases/download/$DEADLINKS_VERSION/cargo-deadlinks-linux" -O cargo-deadlinks
        echo "$DEADLINKS_VERSION" > cargo-deadlinks.version
      fi
    - chmod +x ./cargo-deadlinks
    - PATH=".:$PATH" RUSTDOCFLAGS=-Dwarnings cargo deadlinks
    - mv target/doc public
    - echo '<meta http-equiv="refresh" content="0; url=yottadb">' > public/index.html
  artifacts:
    paths:
      - public
    when: always
